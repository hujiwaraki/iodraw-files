  add(new THREE.CylinderGeometry(0.022, 0.022, 0.55, 10), dark, 0, 0.02, -0.52, Math.PI / 2);
  add(new THREE.BoxGeometry(0.1, 0.11, 0.32), accent, 0, -0.005, -0.38);
  add(new THREE.BoxGeometry(0.07, 0.2, 0.1), dark, 0, -0.16, -0.05, 0.25);
  add(new THREE.BoxGeometry(0.07, 0.16, 0.08), dark, 0, -0.13, 0.17, -0.3);
  add(new THREE.CylinderGeometry(0.035, 0.035, 0.26, 12), dark, 0, 0.13, -0.05, Math.PI / 2);
  add(new THREE.BoxGeometry(0.09, 0.12, 0.3), dark, 0, -0.02, 0.38);
}
gun.position.set(0.2, -0.2, -0.48); gun.scale.setScalar(0.62); fpCam.add(gun);
const muzzle = new THREE.Sprite(new THREE.SpriteMaterial({ map: STAR, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
muzzle.position.set(0, 0.02, -0.86); muzzle.scale.set(0.45, 0.45, 1); gun.add(muzzle);
const muzzleLight = new THREE.PointLight(0xffb060, 0, 8); muzzleLight.position.set(0.24, -0.15, -1.2); fpCam.add(muzzleLight);
const tracerMat = new THREE.LineBasicMaterial({ color: 0xfff0b0, transparent: true, blending: THREE.AdditiveBlending, toneMapped: false });
const tracerGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const tracer = new THREE.Line(tracerGeo, tracerMat); town.add(tracer);
const hitFlash = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffffff, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
town.add(hitFlash);

// FP timeline (local seconds, 0..6). Last kill in slow motion.
const SHOTS = [[2.75, E1], [2.88, E1], [3.85, E2], [3.97, E2], [4.95, E3]];
const KILL = [[E1, 3.0], [E2, 4.1], [E3, 5.05]];
function fpUpdate(lt) {
  // camera path
  const runK = ease(prog(lt, 0, 1.6));
  let z = lerp(0, -9.2, runK), y = 1.7, x = lerp(0, 0.4, runK);
  y -= 0.55 * ease(prog(lt, 1.5, 1.9)) * (1 - ease(prog(lt, 2.4, 2.65)));
  const bob = lt < 1.6 ? Math.sin(lt * 15) * 0.05 : 0;
  fpCam.position.set(x + Math.cos(lt * 7.5) * (lt < 1.6 ? 0.03 : 0), y + bob, z);
  // aim targets
  const look = new THREE.Vector3(0.5, 1.6, -40);
  const aimAt = (e) => new THREE.Vector3(e.g.position.x, 1.5, e.g.position.z);
  if (lt > 2.4) look.lerpVectors(look, aimAt(E1), ease(prog(lt, 2.4, 2.7)));
  if (lt > 3.2) look.lerpVectors(aimAt(E1), aimAt(E2), ease(prog(lt, 3.2, 3.75)));
  if (lt > 4.3) look.lerpVectors(aimAt(E2), aimAt(E3), ease(prog(lt, 4.3, 4.95)));
  // recoil
  let kick = 0; let flash = 0; let lastShot = null;
  for (const [st, e] of SHOTS) { const d = lt - st; if (d >= 0 && d < 0.12) { kick = Math.max(kick, 1 - d / 0.12); } if (d >= 0 && d < 0.06) { flash = 1; lastShot = e; } }
  look.y += kick * 0.9;
  fpCam.lookAt(look);
  fpCam.rotation.z += Math.sin(lt * 2) * 0.01;
  gun.position.z = -0.48 + kick * 0.05; gun.rotation.x = kick * 0.12;
  gun.position.y = -0.2 + bob * 0.4 + (lt < 1.6 ? Math.sin(lt * 7.5) * 0.015 : 0);
  muzzle.visible = flash > 0; muzzle.material.rotation = lt * 40; muzzleLight.intensity = flash * 30;
  tracer.visible = flash > 0;
  if (lastShot) {
    const a = new THREE.Vector3(); muzzle.getWorldPosition(a);
    const b = aimAt(lastShot); tracerGeo.setFromPoints([a, b]);
  }
  // enemy 3 runs across, then all knocked
  E3.g.position.x = lt < 5.05 ? lerp(9, 2.5, prog(lt, 3.6, 5.05)) : 2.5;
  E3.g.rotation.y = -Math.PI / 2;
  hitFlash.visible = false;
  for (const [e, kt] of KILL) {
    const d = lt - kt;
    const fall = ease(prog(d, 0, 0.45));
    e.g.rotation.x = -fall * 1.45; e.g.position.y = 0;
    e.mat.emissive.setRGB(d > 0 && d < 0.25 ? 1.5 : 0, d > 0 && d < 0.25 ? 1.2 : 0, d > 0 && d < 0.25 ? 0.8 : 0);
    if (d > 0 && d < 0.3) { hitFlash.visible = true; hitFlash.position.set(e.g.position.x, 1.4, e.g.position.z + 0.3); const s = 1 + d * 4; hitFlash.scale.set(s, s, 1); hitFlash.material.opacity = 0.8 * (1 - d / 0.3); }
  }
  // smoke grenade (thrown at 1.0, blooms from 1.4)
  const sk = prog(lt, 1.35, 4.5);
  for (let i = 0; i < SMK; i++) {
    const [a, r1, r2] = smkD[i]; const rad = (0.5 + r1 * 4.5) * ease(sk) + 0.2;
    smkPos[i * 3] = -7 + Math.cos(a) * rad + Math.sin(lt * 0.6 + a) * 0.3; smkPos[i * 3 + 1] = 0.5 + r2 * 3.5 * ease(sk); smkPos[i * 3 + 2] = -20 + Math.sin(a) * rad * 0.8;
  }
  smkGeo.attributes.position.needsUpdate = true; smoke.visible = lt > 1.35;
}

// =================================================================== composer + timeline
const composer = new EffectComposer(renderer);
const rp = new RenderPass(arena, arenaCam); composer.addPass(rp);
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.55, 0.72); composer.addPass(bloom);
composer.addPass(new OutputPass());

const FP_S = 4.0, FP_E = 10.6, CHAMP_T = 10.6;
window.DURATION = 13.6;
window.renderAt = (t) => {
  const xh = document.getElementById('xh'), fl = document.getElementById('flash');
  let flashA = 0;
  if (t < FP_S) {                         // A: drone fly-in to the arena
    const k = ease(prog(t, 0, FP_S));
    arenaCam.position.set(lerp(-30, 0, k), lerp(46, 9, k), lerp(110, 34, k));
    arenaCam.lookAt(0, lerp(4, 9, k), -8); arenaCam.rotation.z += lerp(0.12, 0, k);
    updateArena(t, 'final'); rp.scene = arena; rp.camera = arenaCam; bloom.strength = 0.8; bloom.threshold = 0.72; xh.style.display = 'none';
    flashA = clamp((t - (FP_S - 0.15)) / 0.15) * 0.8;
  } else if (t < FP_E) {                  // B: first-person final circle, last kill in slow-mo
    let lt = t - FP_S;
    if (lt > 4.75) lt = 4.75 + (lt - 4.75) * 0.45;
    fpUpdate(lt); rp.scene = town; rp.camera = fpCam; bloom.strength = 0.28; bloom.threshold = 0.9; xh.style.display = 'block';
    flashA = Math.max(1 - (t - FP_S) / 0.25, 0) * 0.8 + clamp((t - (FP_E - 0.12)) / 0.12);
  } else {                                // C: champions
    const lt = t - CHAMP_T; const k = ease(prog(lt, 0, 3));
    arenaCam.position.set(lerp(-14, 10, k), lerp(3.5, 5, k), lerp(26, 20, k));
    arenaCam.lookAt(0, lerp(7, 9, k), -8);
    updateArena(t, 'champ'); rp.scene = arena; rp.camera = arenaCam; bloom.strength = 0.55; bloom.threshold = 0.8; xh.style.display = 'none';
    flashA = Math.max(1 - lt / 0.35, 0);
  }
  fl.style.opacity = flashA;
  composer.render();
  return true;
};
window.ready = true;
</script></body></html>
